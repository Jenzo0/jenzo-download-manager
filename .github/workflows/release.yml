name: Release builds

# Builds JDM for Windows, Linux and macOS and attaches the packages to the GitHub release.
#   - Pushing a tag "v*" builds every platform and creates/updates that release.
#   - "Run workflow" (workflow_dispatch) rebuilds chosen platforms for an existing tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and upload to (e.g. v1.6.1)"
        required: true
        default: "v1.6.1"
      windows:
        description: "Build Windows (installer, MSI, portable)"
        type: boolean
        default: true
      linux:
        description: "Build Linux (AppImage, deb, rpm)"
        type: boolean
        default: true
      macos:
        description: "Build macOS (Apple Silicon + Intel DMG)"
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Plan platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      tag: ${{ steps.m.outputs.tag }}
    steps:
      - id: m
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"; WIN="${{ inputs.windows }}"; LNX="${{ inputs.linux }}"; MAC="${{ inputs.macos }}"
          else
            TAG="${GITHUB_REF_NAME}"; WIN=true; LNX=true; MAC=true
          fi
          items=()
          [ "$WIN" = true ] && items+=('{"name":"windows-x64","os":"windows-latest","target":"x86_64-pc-windows-msvc","bundles":"nsis,msi"}')
          [ "$LNX" = true ] && items+=('{"name":"linux-x64","os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","bundles":"deb,rpm,appimage"}')
          [ "$MAC" = true ] && items+=('{"name":"macos-arm64","os":"macos-15","target":"aarch64-apple-darwin","bundles":"app,dmg"}')
          [ "$MAC" = true ] && items+=('{"name":"macos-x64","os":"macos-15","target":"x86_64-apple-darwin","bundles":"app,dmg"}')
          [ ${#items[@]} -gt 0 ] || { echo "No platform selected"; exit 1; }
          json=$(IFS=,; echo "{\"include\":[${items[*]}]}")
          echo "matrix=$json" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "$json"

  build:
    name: Build ${{ matrix.name }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      # .cargo/config.toml points target-dir outside the checkout for the local build layout;
      # in CI keep everything under ./target so the paths below are stable.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev rpm
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: |
          npm ci --prefix app
          npm ci --prefix extension
      - name: Build extension
        run: npm run build --prefix extension
      - name: Build sidecar
        run: node scripts/build-sidecar.mjs --target ${{ matrix.target }}
      - name: Build app
        working-directory: app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          # Unset secrets that are not configured: an empty APPLE_CERTIFICATE would make the bundler
          # try (and fail) to import a certificate. Without them macOS gets an ad-hoc signature.
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            [ -n "${!v}" ] || unset "$v"
          done
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            echo "No updater signing key configured: building without signed update bundles."
            npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          fi
      - name: Name the macOS update bundle per architecture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          M="target/${{ matrix.target }}/release/bundle/macos"
          V=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          A=$([ "${{ matrix.target }}" = aarch64-apple-darwin ] && echo aarch64 || echo x64)
          shopt -s nullglob
          for f in "$M"/*.app.tar.gz; do mv "$f" "$M/Jenzo_${V}_${A}.app.tar.gz"; done
          for f in "$M"/*.app.tar.gz.sig; do mv "$f" "$M/Jenzo_${V}_${A}.app.tar.gz.sig"; done
      - name: DMG with the browser extension next to the app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          B="target/${{ matrix.target }}/release/bundle"
          DMG=$(ls "$B"/dmg/*.dmg | head -1)
          APP=$(ls -d "$B"/macos/*.app | head -1)
          STAGE="$(mktemp -d)/Jenzo Download Manager"
          mkdir -p "$STAGE/Browser Extension"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          cp -R extension/build/chromium "$STAGE/Browser Extension/Chrome, Edge, Brave"
          cp -R extension/build/firefox "$STAGE/Browser Extension/Firefox"
          cp packaging/macos/README-extension.txt "$STAGE/Browser Extension/How to install.txt"
          rm -f "$DMG"
          hdiutil create -volname "Jenzo Download Manager" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          hdiutil imageinfo "$DMG" | head -5
      - name: Portable zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/make-portable.ps1 -Target ${{ matrix.target }}
      - uses: actions/upload-artifact@v5
        with:
          name: jenzo-${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/bundle/**/*.exe
            target/${{ matrix.target }}/release/bundle/**/*.msi
            target/${{ matrix.target }}/release/bundle/**/*.deb
            target/${{ matrix.target }}/release/bundle/**/*.rpm
            target/${{ matrix.target }}/release/bundle/**/*.AppImage
            target/${{ matrix.target }}/release/bundle/**/*.dmg
            target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            target/${{ matrix.target }}/release/bundle/**/*.sig
            packaging/out/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        if: runner.os == 'Linux'
        with:
          name: jenzo-extension
          path: extension/build/*.zip

  publish:
    name: Publish GitHub release
    needs: [plan, build]
    # Publish whatever built successfully, even if one platform failed.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Collect installers and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          find artifacts -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.deb' \
            -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.zip' -o -name '*.app.tar.gz' \) \
            -exec sh -c 'cp "$1" "out/$(basename "$1" | tr " " ".")"' _ {} \;
          # Updater manifest only when the bundles were signed (TAURI_SIGNING_PRIVATE_KEY secret set).
          if find artifacts -name '*.sig' | grep -q .; then
            python3 scripts/make-latest-json.py artifacts "$TAG" docs/RELEASE_NOTES.md > out/latest.json || rm -f out/latest.json
          fi
          ls -la out
          [ -n "$(ls -A out)" ] || { echo "Nothing was built"; exit 1; }
      - name: Create or update the release
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Jenzo Download Manager $TAG" --notes-file docs/RELEASE_NOTES.md
          fi
          gh release upload "$TAG" out/* --repo "$GITHUB_REPOSITORY" --clobber
          # Checksums for every asset on the release (including ones uploaded by hand).
          mkdir -p sums && cd sums
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --skip-existing
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
